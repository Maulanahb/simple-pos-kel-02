openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter berdasarkan ID kategori
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
          description: Pencarian nama produk
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, '-name', price, '-price']
            default: name
          description: Pengurutan nama atau harga produk
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
          description: Jumlah produk per halaman
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Nomor halaman
      responses:
        '200':
          description: Daftar produk dengan paginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        category:
                          type: string
                  links:
                    type: object
                    description: Tautan navigasi halaman
                  meta:
                    type: object
                    description: Informasi paginasi
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Parameter query tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

# ==============================================================================
# Perbandingan Pengalaman Pengujian API: GUI Client (Bruno / Postman) vs CLI (curl)
# ==============================================================================
# Menguji ketiga endpoint (/api/v1/login, /api/v1/products, dan /api/v1/transactions)
# menggunakan GUI HTTP Client (seperti Bruno / Postman) memberikan pengalaman pengujian
# yang jauh lebih ergonomis dan terstruktur dibanding curl pada CLI. Pada GUI client,
# pengaturan header (Authorization Bearer Token, Idempotency-Key), query parameter, dan
# JSON request body dapat dikelola lewat antarmuka visual tanpa repot melakukan manual
# escaping tanda kutip (\"...\") atau terkendala karakter penyambung baris yang sering
# bermasalah di Command Prompt/PowerShell Windows. Fitur environment variables juga sangat
# mempermudah alur pengujian berantai, seperti menyalin token hasil login ke request produk
# dan transaksi secara dinamis. Respons JSON langsung diformat rapi (pretty-print) lengkap
# dengan status code, waktu respons, dan header yang mudah diinspeksi. Di sisi lain, curl
# tetap unggul dalam kecepatan eksekusi cepat langsung dari terminal tanpa perlu membuka
# aplikasi terpisah, sangat ringan, dan paling ideal untuk scripting otomatisasi maupun CI/CD.

